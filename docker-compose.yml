version: '3.8'

services:
  # ── SCMS Components ──────────────────────────────────────────────────────────
  root-ca:
    build: .
    command: python scms/root_ca.py
    volumes:
      - ./scms:/app/scms
      - ./data/certs:/app/data/certs
    ports:
      - "5001:5001"

  intermediate-ca:
    build: .
    command: python scms/intermediate_ca.py
    volumes:
      - ./scms:/app/scms
    depends_on:
      - root-ca
    environment:
      - ROOT_CA_URL=http://root-ca:5001
    ports:
      - "5002:5002"

  pca:
    build: .
    command: python scms/pca.py
    volumes:
      - ./scms:/app/scms
    depends_on:
      - intermediate-ca
      - linkage-auth-1
      - linkage-auth-2
    environment:
      - ICA_URL=http://intermediate-ca:5002
    ports:
      - "5005:5005"

  linkage-auth-1:
    build: .
    command: python scms/linkage_auth.py --id 1
    volumes:
      - ./scms:/app/scms
    ports:
      - "6001:6001"

  linkage-auth-2:
    build: .
    command: python scms/linkage_auth_2.py --id 2
    volumes:
      - ./scms:/app/scms
    ports:
      - "6002:6002"

  ra:
    build: .
    command: python scms/registration_authority.py
    volumes:
      - ./scms:/app/scms
    depends_on:
      - pca
      - intermediate-ca
      - linkage-auth-1
      - linkage-auth-2
    ports:
      - "5003:5003"

  ma:
    build: .
    command: python scms/misbehavior_authority.py
    volumes:
      - ./scms:/app/scms
      - ./data/crl:/app/data/crl
    depends_on:
      - ra
      - pca
    ports:
      - "5004:5004"

  # ── Vehicles ─────────────────────────────────────────────────────────────────
  vehicle-1:
    build: .
    command: python vehicles/vehicle.py --id 1
    volumes:
      - ./vehicles:/app/vehicles
    depends_on: [ra, ma]
    environment:
      - DASHBOARD_HOST=dashboard
      - DASHBOARD_PORT=5008

  vehicle-2:
    build: .
    command: python vehicles/vehicle.py --id 2
    volumes:
      - ./vehicles:/app/vehicles
    depends_on: [ra, ma]
    environment:
      - DASHBOARD_HOST=dashboard
      - DASHBOARD_PORT=5008

  vehicle-3:
    build: .
    command: python vehicles/vehicle.py --id 3
    volumes:
      - ./vehicles:/app/vehicles
    depends_on: [ra, ma]
    environment:
      - DASHBOARD_HOST=dashboard
      - DASHBOARD_PORT=5008

  vehicle-4:
    build: .
    command: python vehicles/vehicle.py --id 4
    volumes:
      - ./vehicles:/app/vehicles
    depends_on: [ra, ma]
    environment:
      - DASHBOARD_HOST=dashboard
      - DASHBOARD_PORT=5008

  vehicle-5:
    build: .
    command: python vehicles/vehicle.py --id 5
    volumes:
      - ./vehicles:/app/vehicles
    depends_on: [ra, ma]
    environment:
      - DASHBOARD_HOST=dashboard
      - DASHBOARD_PORT=5008

  vehicle-6:
    build: .
    command: python vehicles/vehicle.py --id 6
    volumes:
      - ./vehicles:/app/vehicles
    depends_on: [ra, ma]
    environment:
      - DASHBOARD_HOST=dashboard
      - DASHBOARD_PORT=5008

  vehicle-7:
    build: .
    command: python vehicles/vehicle.py --id 7
    volumes:
      - ./vehicles:/app/vehicles
    depends_on: [ra, ma]
    environment:
      - DASHBOARD_HOST=dashboard
      - DASHBOARD_PORT=5008

  # ── Infrastructure ────────────────────────────────────────────────────────────
  rse-1:
    build: .
    command: python infrastructure/rse.py --id 1
    volumes:
      - ./infrastructure:/app/infrastructure
    depends_on: [ra, ma]

  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:14
    environment:
      - POSTGRES_PASSWORD=v2xsecurity
      - POSTGRES_DB=v2x_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ── Dashboard ─────────────────────────────────────────────────────────────────
  dashboard:
    build: .
    command: python dashboard/app.py
    volumes:
      - ./dashboard:/app/dashboard
    ports:
      - "9001:8000"
    depends_on:
      - vehicle-1
      - vehicle-2
      - vehicle-3
      - vehicle-4
      - vehicle-5
      - vehicle-6
      - vehicle-7
      - rse-1

volumes:
  postgres_data:
